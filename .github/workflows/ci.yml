name: CI - Quality & Integrity Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Markdown Links & Syntax
        run: |
          echo "Verifying markdown structure..."
          python -c "
          import os, glob
          md_files = glob.glob('**/*.md', recursive=True)
          print(f'Discovered {len(md_files)} markdown files across repository.')
          assert len(md_files) > 0, 'No markdown files found!'
          "

      - name: Security Check for Accidental Secrets
        run: |
          echo "Scanning for accidental secrets or private credentials..."
          python -c "
          import os, glob, re
          secret_patterns = [r'(?i)api[_-]?key\s*[:=]\s*[\'\"][a-zA-Z0-9_\-]{20,}[\'\"]', r'ghp_[a-zA-Z0-9]{36}']
          for path in glob.glob('**/*.md', recursive=True):
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
                  for pattern in secret_patterns:
                      if re.search(pattern, content):
                          raise ValueError(f'Potential secret pattern detected in {path}')
          print('Security scan clean! No exposed secrets found.')
          "
